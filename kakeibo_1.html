<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="家計簿">
<meta name="theme-color" content="#F4F4F3">
<title>家計簿</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="家計簿">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F4F4F3;
    --paper-deep:#E7E7E5;
    --line:#D2D2D0;
    --line-soft:#E0E0DE;
    --ink:#202124;
    --ink-soft:#6B6B6B;
    --indigo:#1F4E79;
    --indigo-dark:#163C5E;
    --indigo-tint:#E3EBF1;
    --hanko:#14283B;
    --hanko-tint:#E3E7EB;
    --moss:#3E7CB1;
    --moss-tint:#E2ECF3;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    background-color:var(--paper);
    color:var(--ink);
    font-family:'Zen Kaku Gothic New', sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.serif{font-family:'Zen Kaku Gothic New', sans-serif;font-weight:700;}
  button{font-family:inherit;}
  input,select{font-family:inherit;font-size:15px;}
  #app{display:block;min-height:100vh;}
  .main-col{display:flex;flex-direction:column;min-height:100vh;}

  /* ---------- topbar ---------- */
  .topbar{
    flex:0 0 auto;
    display:flex;align-items:center;justify-content:center;gap:14px;
    padding:calc(18px + env(safe-area-inset-top)) 12px 14px;
    border-bottom:1px solid var(--line);
    background:linear-gradient(var(--paper), var(--paper) 90%, transparent);
  }
  .topbar .app-title{
    position:absolute;left:16px;top:14px;
    font-size:13px;letter-spacing:0.12em;color:var(--ink-soft);
    display:none;
  }
  .month-nav{display:flex;align-items:center;gap:10px;}
  .month-nav button{
    width:34px;height:34px;border-radius:2px;border:1px solid var(--line);
    background:var(--paper);color:var(--indigo);cursor:pointer;
    display:flex;align-items:center;justify-content:center;
  }
  .month-nav button:active{background:var(--indigo-tint);}
  .month-label{font-size:21px;font-weight:700;letter-spacing:0.02em;
    position:relative;padding-bottom:6px;min-width:150px;text-align:center;}
  .month-label:after{
    content:'';position:absolute;left:18%;right:18%;bottom:0;height:2px;
    background:var(--indigo);opacity:0.55;border-radius:1px;
  }
  .back-today{
    font-size:12px;color:var(--indigo);text-decoration:underline;text-underline-offset:2px;
    background:none;border:none;cursor:pointer;padding:0;margin-left:2px;
  }

  /* ---------- content ---------- */
  #content{flex:1 1 auto;padding:18px 16px 96px;max-width:640px;margin:0 auto;width:100%;}
  .section-title{
    font-size:15px;font-weight:600;color:var(--ink);margin:26px 0 10px;
    display:flex;align-items:center;gap:8px;
  }
  .section-title:first-child{margin-top:4px;}
  .section-title .dot{width:6px;height:6px;background:var(--hanko);border-radius:50%;}

  /* ---------- hero ---------- */
  .hero{
    background:var(--paper);border:1px solid var(--line);border-radius:3px;
    padding:20px 18px;text-align:center;margin-bottom:18px;
    box-shadow:0 1px 0 var(--line-soft);
  }
  .hero .hero-label{font-size:12px;color:var(--ink-soft);letter-spacing:0.08em;}
  .hero .hero-amount{
    font-size:38px;font-weight:900;margin:6px 0 2px;letter-spacing:0.01em;
    font-variant-numeric:tabular-nums;
  }
  .hero .hero-amount.pos{color:var(--moss);}
  .hero .hero-amount.neg{color:var(--hanko);}
  .hero-sub{display:flex;justify-content:center;gap:22px;margin-top:8px;font-size:13px;color:var(--ink-soft);}
  .hero-sub b{color:var(--ink);font-variant-numeric:tabular-nums;}

  /* ---------- ledger row (dotted leader) ---------- */
  .ledger-row{display:flex;align-items:baseline;gap:8px;padding:8px 0;}
  .ledger-row .label{white-space:nowrap;font-size:14px;}
  .ledger-row .leader{flex:1;border-bottom:1px dotted var(--ink-soft);opacity:0.45;margin-bottom:4px;}
  .ledger-row .value{white-space:nowrap;font-size:14px;font-variant-numeric:tabular-nums;}

  .cat-block{border-bottom:1px solid var(--line-soft);padding-bottom:10px;margin-bottom:4px;}
  .cat-block:last-child{border-bottom:none;}
  .cat-block .ledger-row{padding-bottom:2px;}
  .cat-block .unset{color:var(--ink-soft);font-size:12px;}

  /* budget bar - flat ruled ledger bar */
  .bar-track{
    position:relative;height:10px;background:var(--paper-deep);
    border:1px solid var(--line);border-radius:1px;overflow:hidden;margin-top:2px;
  }
  .bar-fill{position:absolute;left:0;top:0;bottom:0;background:var(--indigo);}
  .bar-fill.over{background:var(--hanko);}
  .bar-track .tick{position:absolute;top:0;bottom:0;width:1px;background:rgba(240,236,224,0.7);}

  /* ---------- overall totals row ---------- */
  .totals-card{border:1px solid var(--line);border-radius:3px;padding:14px 16px;margin-bottom:20px;}

  /* ---------- record tab ---------- */
  .type-toggle{display:flex;border:1px solid var(--indigo);border-radius:3px;overflow:hidden;margin-bottom:16px;}
  .type-toggle button{
    flex:1;padding:10px 0;background:var(--paper);border:none;cursor:pointer;
    font-size:14px;font-weight:600;color:var(--indigo);
  }
  .type-toggle button.active{background:var(--indigo);color:#fff;}
  .type-toggle button.active.income{background:var(--moss);}

  .field{margin-bottom:14px;}
  .field label{display:block;font-size:12px;color:var(--ink-soft);margin-bottom:5px;}
  .field input, .field select{
    width:100%;padding:10px 10px;border:1px solid var(--line);border-radius:2px;
    background:#fff;color:var(--ink);
  }
  .field input:focus, .field select:focus{outline:2px solid var(--indigo);outline-offset:1px;}
  .amount-field input{font-size:22px;font-variant-numeric:tabular-nums;font-weight:700;}
  input[type=number]{-moz-appearance:textfield;appearance:textfield;}
  input[type=number]::-webkit-outer-spin-button,
  input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
  .btn-primary{
    width:100%;padding:12px 0;background:var(--indigo);color:#fff;border:none;border-radius:2px;
    font-size:15px;font-weight:700;cursor:pointer;letter-spacing:0.03em;
  }
  .btn-primary.income{background:var(--moss);}
  .btn-primary:active{opacity:0.85;}
  .btn-cancel-edit{
    display:block;width:100%;text-align:center;background:none;border:none;color:var(--ink-soft);
    font-size:13px;padding:10px 0 0;cursor:pointer;text-decoration:underline;
  }
  fieldset{border:none;padding:0;margin:0;}

  .tx-list{margin-top:22px;}
  .tx-item{
    display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px dashed var(--line);
    cursor:pointer;
  }
  .tx-item:active{background:var(--paper-deep);}
  .tx-chip{
    font-size:11px;padding:3px 8px;border-radius:2px;white-space:nowrap;
    background:var(--indigo-tint);color:var(--indigo-dark);
  }
  .tx-chip.income{background:var(--moss-tint);color:var(--moss);}
  .tx-main{flex:1;min-width:0;}
  .tx-sub{font-size:12px;color:var(--ink-soft);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .tx-date{font-size:11px;color:var(--ink-soft);width:44px;flex:0 0 auto;}
  .tx-amount{font-variant-numeric:tabular-nums;font-weight:700;font-size:14px;white-space:nowrap;}
  .tx-amount.income{color:var(--moss);}
  .tx-amount.expense{color:var(--ink);}
  .tx-del{
    flex:0 0 auto;width:26px;height:26px;border:none;background:none;color:var(--hanko);
    font-size:16px;cursor:pointer;border-radius:50%;
  }
  .empty-note{color:var(--ink-soft);font-size:13px;text-align:center;padding:26px 0;}

  /* ---------- confirm delete row ---------- */
  .confirm-row{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--hanko);}
  .confirm-row button{
    border:1px solid var(--hanko);background:#fff;color:var(--hanko);border-radius:2px;
    padding:3px 9px;font-size:12px;cursor:pointer;
  }
  .confirm-row button.yes{background:var(--hanko);color:#fff;}

  /* ---------- budget tab ---------- */
  .budget-row-wrap{border-bottom:1px solid var(--line-soft);padding:12px 0;}
  .budget-row-wrap .ledger-row{padding:0 0 8px;}
  .budget-row-wrap input.default-budget-input{
    width:110px;text-align:right;padding:6px 8px;border:1px solid var(--line);border-radius:2px;
    font-variant-numeric:tabular-nums;
  }
  .override-toggle{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink-soft);flex-wrap:wrap;}
  .override-toggle input[type=number]{
    width:110px;padding:5px 8px;border:1px solid var(--line);border-radius:2px;font-variant-numeric:tabular-nums;
  }
  .save-bar{position:sticky;bottom:0;background:var(--paper);padding:14px 0 4px;}
  .saved-msg{font-size:12px;color:var(--moss);text-align:center;margin-top:8px;height:16px;}

  /* ---------- settings tab ---------- */
  .settings-card{border:1px solid var(--line);border-radius:3px;padding:12px 14px;margin-bottom:12px;background:rgba(255,255,255,0.35);}
  .settings-card-head{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
  .settings-card-head input{
    flex:1;font-size:16px;font-weight:700;
    border:none;background:none;border-bottom:1px solid transparent;padding:2px 0;
  }
  .settings-card-head input:focus{outline:none;border-bottom:1px solid var(--indigo);}
  .icon-btn{border:none;background:none;color:var(--hanko);cursor:pointer;padding:4px;flex:0 0 auto;}
  .sub-list{padding-left:6px;border-left:2px solid var(--line-soft);}
  .sub-row, .add-row{display:flex;align-items:center;gap:8px;padding:5px 0;}
  .sub-row input, .add-row input{
    flex:1;border:none;border-bottom:1px dashed var(--line);background:none;padding:4px 2px;font-size:13px;
  }
  .sub-row input:focus, .add-row input:focus{outline:none;border-bottom:1px solid var(--indigo);}
  .add-row button, .add-major-btn{
    border:1px solid var(--indigo);color:var(--indigo);background:none;border-radius:2px;
    padding:5px 10px;font-size:12px;cursor:pointer;flex:0 0 auto;
  }
  .flat-list-item{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px dashed var(--line);}
  .flat-list-item input{flex:1;border:none;background:none;border-bottom:1px solid transparent;padding:3px 0;font-size:14px;}
  .flat-list-item input:focus{outline:none;border-bottom:1px solid var(--indigo);}
  .guard-note{font-size:11px;color:var(--ink-soft);margin-top:4px;}

  /* ---------- tabbar ---------- */
  .tabbar{
    position:fixed;left:0;right:0;bottom:0;height:calc(64px + env(safe-area-inset-bottom));
    padding-bottom:env(safe-area-inset-bottom);
    display:flex;flex-direction:row;
    background:var(--paper);border-top:1px dashed var(--line);z-index:20;
  }
  .tabbar button{
    flex:1;background:none;border:none;display:flex;flex-direction:column;align-items:center;
    justify-content:center;gap:3px;color:var(--ink-soft);cursor:pointer;font-size:11px;
  }
  .tabbar button svg{width:20px;height:20px;}
  .tabbar button.active{color:var(--indigo);}
  .tabbar button.active svg{color:var(--indigo);}

  @media (min-width:768px){
    #app{display:flex;flex-direction:row;min-height:100vh;}
    .tabbar{
      position:static;flex:0 0 200px;height:auto;flex-direction:column;
      border-top:none;border-right:1px dashed var(--line);padding-top:18px;gap:2px;align-items:stretch;
    }
    .tabbar button{flex-direction:row;justify-content:flex-start;gap:10px;padding:12px 22px;font-size:14px;}
    .main-col{flex:1;min-height:100vh;}
    .app-title{display:block !important;}
    .topbar{padding-left:60px;position:relative;}
    #content{padding:24px 32px 60px;max-width:640px;}
  }
</style>
</head>
<body>
<div id="app">
  <nav class="tabbar" id="tabbar"></nav>
  <div class="main-col">
    <header class="topbar">
      <span class="app-title serif">家計簿</span>
      <div class="month-nav">
        <button data-action="prev-month" aria-label="前の月">‹</button>
        <div class="month-label" id="monthLabel"></div>
        <button data-action="next-month" aria-label="次の月">›</button>
      </div>
    </header>
    <main id="content"></main>
  </div>
</div>

<script>
/* ===================== storage helpers (browser localStorage) =====================
   このアプリは端末のブラウザ内(localStorage)にデータを保存します。
   Claudeのアカウントとは無関係に、完全に独立して動作します。
   ただし保存先は「この端末のこのブラウザ」だけなので、他の端末とは自動で同期されません。
*/
const STORAGE_PREFIX = 'kakeibo:';
async function loadJSON(key, fallback){
  try{
    const raw = window.localStorage.getItem(STORAGE_PREFIX+key);
    if(raw===null || raw===undefined) return fallback;
    return JSON.parse(raw);
  }catch(e){ return fallback; }
}
async function saveJSON(key, value){
  try{ window.localStorage.setItem(STORAGE_PREFIX+key, JSON.stringify(value)); }
  catch(e){ console.error('storage save failed', key, e); }
}
function uid(prefix){
  return prefix+'-'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
}
function escapeHtml(s){
  return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
const yen = new Intl.NumberFormat('ja-JP',{style:'currency',currency:'JPY',maximumFractionDigits:0});
function fmtYen(n){ return yen.format(Math.round(n||0)); }

/* ===================== default data ===================== */
function defaultCategories(){
  return [
    {id:'food',name:'食費',subs:[{id:'food-grocery',name:'食料品'},{id:'food-eatout',name:'外食'},{id:'food-cafe',name:'カフェ・嗜好品'}]},
    {id:'daily',name:'日用品',subs:[{id:'daily-consumable',name:'消耗品'},{id:'daily-clothes',name:'衣類'}]},
    {id:'transport',name:'交通費',subs:[{id:'transport-train',name:'電車・バス'},{id:'transport-car',name:'車・ガソリン'},{id:'transport-taxi',name:'タクシー'}]},
    {id:'housing',name:'住居費',subs:[{id:'housing-rent',name:'家賃・ローン'},{id:'housing-repair',name:'修繕・家具'}]},
    {id:'utility',name:'水道光熱費',subs:[{id:'utility-elec',name:'電気'},{id:'utility-gas',name:'ガス'},{id:'utility-water',name:'水道'}]},
    {id:'comm',name:'通信費',subs:[{id:'comm-phone',name:'携帯電話'},{id:'comm-net',name:'インターネット'}]},
    {id:'fun',name:'娯楽費',subs:[{id:'fun-hobby',name:'趣味'},{id:'fun-social',name:'交際費'}]},
    {id:'medical',name:'医療費',subs:[{id:'medical-hospital',name:'病院'},{id:'medical-drug',name:'薬'}]},
    {id:'other',name:'その他',subs:[{id:'other-misc',name:'雑費'}]}
  ];
}
function defaultIncomeCategories(){
  return [{id:'salary',name:'給与'},{id:'side',name:'副収入'},{id:'other-income',name:'その他'}];
}
function defaultPaymentMethods(){
  return [{id:'cash',name:'現金'},{id:'card',name:'クレジットカード'},{id:'emoney',name:'電子マネー'}];
}

/* ===================== state ===================== */
const state = {
  categories:[], incomeCategories:[], paymentMethods:[], budgetDefault:{},
  currentMonth:'', monthData:{transactions:[], budgetOverride:{}},
  tab:'summary', txType:'expense', editingTxId:null, confirmPending:null,
  loaded:false
};

function monthStr(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); }
function realCurrentMonth(){ return monthStr(new Date()); }
function shiftMonth(ym, delta){
  const [y,m] = ym.split('-').map(Number);
  const d = new Date(y, m-1+delta, 1);
  return monthStr(d);
}
function monthLabel(ym){
  const [y,m]=ym.split('-').map(Number);
  return y+'年'+m+'月';
}
function monthRange(ym){
  const [y,m]=ym.split('-').map(Number);
  const last = new Date(y,m,0).getDate();
  return {min: ym+'-01', max: ym+'-'+String(last).padStart(2,'0'), lastDay:last};
}
function todayInMonth(ym){
  const today = new Date();
  const ymToday = monthStr(today);
  if(ymToday===ym) return ym+'-'+String(today.getDate()).padStart(2,'0');
  return ym+'-01';
}

async function loadMonth(ym){
  const tx = await loadJSON('transactions:'+ym, []);
  const ov = await loadJSON('budgetOverride:'+ym, {});
  state.monthData = {transactions:tx, budgetOverride:ov};
}

async function init(){
  let cats = await loadJSON('categories', null);
  if(!cats){ cats = defaultCategories(); await saveJSON('categories', cats); }
  state.categories = cats;

  let inc = await loadJSON('incomeCategories', null);
  if(!inc){ inc = defaultIncomeCategories(); await saveJSON('incomeCategories', inc); }
  state.incomeCategories = inc;

  let pay = await loadJSON('paymentMethods', null);
  if(!pay){ pay = defaultPaymentMethods(); await saveJSON('paymentMethods', pay); }
  state.paymentMethods = pay;

  state.budgetDefault = await loadJSON('budgetDefault', {});

  state.currentMonth = realCurrentMonth();
  await loadMonth(state.currentMonth);
  state.loaded = true;
  renderApp();
}

/* ===================== calc helpers ===================== */
function effectiveBudget(majorId){
  const ov = state.monthData.budgetOverride[majorId];
  if(ov!==undefined && ov!==null) return ov;
  return state.budgetDefault[majorId] || 0;
}
function monthTotals(){
  let income=0, expense=0;
  state.monthData.transactions.forEach(t=>{
    if(t.type==='income') income+=t.amount; else expense+=t.amount;
  });
  return {income, expense, balance: income-expense};
}
function categorySpend(){
  const map = {};
  state.monthData.transactions.forEach(t=>{
    if(t.type!=='expense') return;
    map[t.majorId] = map[t.majorId]||{name:t.majorName, amount:0};
    map[t.majorId].amount += t.amount;
  });
  return map;
}

/* ===================== icons ===================== */
const ICONS = {
  summary:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M4 20V10M12 20V4M20 20v-7"/></svg>',
  record:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 8v8M8 12h8"/></svg>',
  budget:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="12" rx="1.5"/><path d="M3 10h18M8 14h2"/></svg>',
  settings:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M4 6h10M18 6h2M4 12h4M10 12h10M4 18h13M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="8" cy="12" r="2"/><circle cx="17" cy="18" r="2"/></svg>'
};
const TABS = [
  {id:'summary', label:'集計'},
  {id:'record', label:'記録'},
  {id:'budget', label:'予算'},
  {id:'settings', label:'設定'}
];

/* ===================== render: shell ===================== */
function renderApp(){
  document.getElementById('monthLabel').textContent = monthLabel(state.currentMonth);
  const tb = document.getElementById('tabbar');
  tb.innerHTML = TABS.map(t=>
    `<button data-action="switch-tab" data-tab="${t.id}" class="${state.tab===t.id?'active':''}">${ICONS[t.id]}<span>${t.label}</span></button>`
  ).join('');
  renderTab();
}

function renderTab(){
  const el = document.getElementById('content');
  if(!state.loaded){ el.innerHTML=''; return; }
  if(state.tab==='summary') el.innerHTML = renderSummary();
  else if(state.tab==='record') el.innerHTML = renderRecord();
  else if(state.tab==='budget') el.innerHTML = renderBudget();
  else if(state.tab==='settings') el.innerHTML = renderSettings();
  afterRenderTabExtras();
}
function afterRenderTabExtras(){
  if(state.tab==='record'){
    const dateInput = document.getElementById('txDate');
    if(dateInput){
      const r = monthRange(state.currentMonth);
      dateInput.min = r.min; dateInput.max = r.max;
    }
  }
}

/* ===================== render: summary ===================== */
function renderSummary(){
  const t = monthTotals();
  const balCls = t.balance>=0 ? 'pos':'neg';
  const totalBudget = state.categories.reduce((s,c)=>s+effectiveBudget(c.id),0);
  const overallPct = totalBudget>0 ? Math.min(100, Math.round(t.expense/totalBudget*100)) : 0;
  const overallOver = totalBudget>0 && t.expense>totalBudget;
  const spendMap = categorySpend();

  const backToday = state.currentMonth!==realCurrentMonth()
    ? `<div style="text-align:center;margin-bottom:14px;"><button class="back-today" data-action="back-today">今月に戻る</button></div>` : '';

  let catHtml = state.categories.map(c=>{
    const spent = (spendMap[c.id] && spendMap[c.id].amount) || 0;
    const budget = effectiveBudget(c.id);
    const hasBudget = budget>0;
    const pct = hasBudget ? Math.min(100, Math.round(spent/budget*100)) : 0;
    const over = hasBudget && spent>budget;
    return `
      <div class="cat-block">
        <div class="ledger-row">
          <span class="label">${escapeHtml(c.name)}</span>
          <span class="leader"></span>
          <span class="value">${hasBudget ? fmtYen(spent)+' / '+fmtYen(budget) : fmtYen(spent)+' <span class="unset">(予算未設定)</span>'}</span>
        </div>
        ${hasBudget ? `<div class="bar-track"><div class="bar-fill ${over?'over':''}" style="width:${pct}%"></div>
          <div class="tick" style="left:25%"></div><div class="tick" style="left:50%"></div><div class="tick" style="left:75%"></div>
        </div>` : ''}
      </div>`;
  }).join('');

  const knownIds = new Set(state.categories.map(c=>c.id));
  const orphan = Object.keys(spendMap).filter(id=>!knownIds.has(id));
  let orphanHtml = '';
  if(orphan.length){
    orphanHtml = `<div class="section-title"><span class="dot"></span>削除済みカテゴリの支出</div>` +
      orphan.map(id=>{
        const d = spendMap[id];
        return `<div class="cat-block"><div class="ledger-row"><span class="label">${escapeHtml(d.name||'(不明)')}</span><span class="leader"></span><span class="value">${fmtYen(d.amount)}</span></div></div>`;
      }).join('');
  }

  return `
    ${backToday}
    <div class="hero">
      <div class="hero-label">今月の収支</div>
      <div class="hero-amount ${balCls}">${t.balance>=0?'+':''}${fmtYen(t.balance)}</div>
      <div class="hero-sub">
        <span>収入 <b>${fmtYen(t.income)}</b></span>
        <span>支出 <b>${fmtYen(t.expense)}</b></span>
      </div>
    </div>

    <div class="section-title"><span class="dot"></span>予算の消化状況</div>
    <div class="totals-card">
      <div class="ledger-row">
        <span class="label">総支出</span><span class="leader"></span>
        <span class="value">${fmtYen(t.expense)} / ${totalBudget>0?fmtYen(totalBudget):'未設定'}</span>
      </div>
      ${totalBudget>0 ? `<div class="bar-track"><div class="bar-fill ${overallOver?'over':''}" style="width:${overallPct}%"></div>
        <div class="tick" style="left:25%"></div><div class="tick" style="left:50%"></div><div class="tick" style="left:75%"></div></div>` : ''}
    </div>

    <div class="section-title"><span class="dot"></span>カテゴリ別（大区分）</div>
    ${catHtml || '<div class="empty-note">カテゴリがありません</div>'}
    ${orphanHtml}
  `;
}

/* ===================== render: record ===================== */

  const majorOptions = state.categories.map(c=>`<option value="${c.id}">${escapeHtml(c.name)}</option>`).join('');

  const subOptions = subsForMajor.map(s=>`<option value="${s.id}">${escapeHtml(s.name)}</option>`).join('');
  const incomeOptions = state.incomeCategories.map(c=>`<option value="${c.id}">${escapeHtml(c.name)}</option>`).join('');
  const payOptions = state.paymentMethods.map(p=>`<option value="${p.id}">${escapeHtml(p.name)}</option>`).join('');

  const r = monthRange(state.currentMonth);

  const list = state.monthData.transactions.slice().sort((a,b)=> a.date<b.date?1:(a.date>b.date?-1:0));

function confirmOrDelete(type, id){
  if(state.confirmPending && state.confirmPending.type===type && state.confirmPending.id===id){
    return `<span class="confirm-row" onclick="event.stopPropagation()">
      <button class="yes" data-action="confirm-delete" data-type="${type}" data-id="${id}">削除</button>
      <button data-action="cancel-delete">戻す</button>
    </span>`;
  }
  return `<button class="tx-del" data-action="ask-delete" data-type="${type}" data-id="${id}" onclick="event.stopPropagation()">×</button>`;
}

/* ===================== backup: export / import ===================== */
function exportAllData(){
  const data = {};
  for(let i=0;i<window.localStorage.length;i++){
    const k = window.localStorage.key(i);
    if(k && k.startsWith(STORAGE_PREFIX)) data[k]=window.localStorage.getItem(k);
  }
  const blob = new Blob([JSON.stringify(data,null,2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const now = new Date();
  const stamp = now.getFullYear()+String(now.getMonth()+1).padStart(2,'0')+String(now.getDate()).padStart(2,'0');
  a.href=url; a.download = 'kakeibo-backup-'+stamp+'.json';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
function importAllData(file){
  const reader = new FileReader();
  reader.onload = (e)=>{
    try{
      const data = JSON.parse(e.target.result);
      Object.keys(data).forEach(k=>{
        if(k.startsWith(STORAGE_PREFIX)) window.localStorage.setItem(k, data[k]);
      });
      location.reload();
    }catch(err){
      const msg=document.getElementById('importMsg');
      if(msg) msg.textContent='読み込みに失敗しました。ファイルを確認してください。';
    }
  };
  reader.readAsText(file);
}

/* ===================== mutations ===================== */
async function persistMonth(){
  await saveJSON('transactions:'+state.currentMonth, state.monthData.transactions);
  await saveJSON('budgetOverride:'+state.currentMonth, state.monthData.budgetOverride);
}

function buildTxFromForm(form){
  const fd = new FormData(form);
  const type = state.editingTxId
    ? (state.monthData.transactions.find(t=>t.id===state.editingTxId)||{}).type || state.txType
    : state.txType;
  const amount = Math.max(0, Math.round(Number(fd.get('amount'))||0));
  let date = fd.get('date');
  const r = monthRange(state.currentMonth);
  if(date < r.min) date = r.min; if(date > r.max) date = r.max;
  const memo = (fd.get('memo')||'').toString().trim();

  if(type==='expense'){
    const majorId = fd.get('majorId');
    const major = state.categories.find(c=>c.id===majorId);
    const subId = fd.get('subId');
    const sub = major ? major.subs.find(s=>s.id===subId) : null;
    const payId = fd.get('paymentMethodId');
    const pay = state.paymentMethods.find(p=>p.id===payId);
    return {type:'expense', amount, date, memo,
      majorId, majorName: major?major.name:'(不明)',
      subId: sub?sub.id:'', subName: sub?sub.name:'',
      paymentMethodId: pay?pay.id:'', paymentMethodName: pay?pay.name:''};
  }else{
    const incId = fd.get('incomeCategoryId');
    const inc = state.incomeCategories.find(c=>c.id===incId);
    return {type:'income', amount, date, memo,
      incomeCategoryId: inc?inc.id:'', incomeCategoryName: inc?inc.name:'(不明)'};
  }
}

/* ===================== event delegation ===================== */
document.addEventListener('click', async (e)=>{
  const t = e.target.closest('[data-action]');
  if(!t) return;
  const action = t.dataset.action;

  if(action==='switch-tab'){
    state.tab = t.dataset.tab; state.editingTxId=null; state.confirmPending=null; renderApp(); return;
  }
  if(action==='prev-month'){
    state.currentMonth = shiftMonth(state.currentMonth,-1); state.editingTxId=null; state.confirmPending=null;
    await loadMonth(state.currentMonth); renderApp(); return;
  }
  if(action==='next-month'){
    state.currentMonth = shiftMonth(state.currentMonth,1); state.editingTxId=null; state.confirmPending=null;
    await loadMonth(state.currentMonth); renderApp(); return;
  }
  if(action==='back-today'){
    state.currentMonth = realCurrentMonth(); state.editingTxId=null; state.confirmPending=null;
    await loadMonth(state.currentMonth); renderApp(); return;
  }
  if(action==='set-tx-type'){
    state.txType = t.dataset.type;
    document.getElementById('expense-fields').style.display = state.txType==='expense'?'block':'none';
    document.getElementById('income-fields').style.display = state.txType==='income'?'block':'none';
    document.querySelectorAll('.type-toggle button').forEach(b=>{
      b.classList.toggle('active', b.dataset.type===state.txType);
    });
    const form = document.getElementById('tx-form');
    form.querySelector('.btn-primary').classList.toggle('income', state.txType==='income');
    form.querySelector('.btn-primary').textContent = state.editingTxId ? '更新する' : '記録する';
    return;
  }
  if(action==='edit-tx'){
    state.editingTxId = t.dataset.id; state.confirmPending=null; renderTab(); return;
  }
  if(action==='cancel-edit'){
    state.editingTxId = null; renderTab(); return;
  }
  if(action==='ask-delete'){
    if(t.disabled) return;
    state.confirmPending = {type:t.dataset.type, id:t.dataset.id}; renderTab(); return;
  }
  if(action==='cancel-delete'){
    state.confirmPending = null; renderTab(); return;
  }
  if(action==='confirm-delete'){
    await performDelete(t.dataset.type, t.dataset.id);
    state.confirmPending = null; renderTab(); return;
  }
  if(action==='add-major'){
    const input = document.getElementById('newmajor');
    const name = input.value.trim();
    if(!name) return;
    state.categories.push({id:uid('m'), name, subs:[]});
    await saveJSON('categories', state.categories);
    renderTab(); return;
  }
  if(action==='add-sub'){
    const majorId = t.dataset.major;
    const input = document.getElementById('newsub-'+majorId);
    const name = input.value.trim();
    if(!name) return;
    const major = state.categories.find(c=>c.id===majorId);
    if(major){ major.subs.push({id:uid('s'), name}); await saveJSON('categories', state.categories); }
    renderTab(); return;
  }
  if(action==='add-pay'){
    const input = document.getElementById('newpay');
    const name = input.value.trim(); if(!name) return;
    state.paymentMethods.push({id:uid('p'), name});
    await saveJSON('paymentMethods', state.paymentMethods); renderTab(); return;
  }
  if(action==='add-inc'){
    const input = document.getElementById('newinc');
    const name = input.value.trim(); if(!name) return;
    state.incomeCategories.push({id:uid('i'), name});
    await saveJSON('incomeCategories', state.incomeCategories); renderTab(); return;
  }
  if(action==='export-data'){
    exportAllData(); return;
  }
  if(action==='import-data'){
    const fileInput = document.getElementById('importFile');
    const msg = document.getElementById('importMsg');
    if(!fileInput.files || !fileInput.files[0]){
      if(msg) msg.textContent='ファイルを選択してください';
      return;
    }
    importAllData(fileInput.files[0]);
    return;
  }
});

async function performDelete(type, id){
  if(type==='tx'){
    state.monthData.transactions = state.monthData.transactions.filter(t=>t.id!==id);
    if(state.editingTxId===id) state.editingTxId=null;
    await persistMonth();
  }else if(type==='major'){
    if(state.categories.length<=1) return;
    state.categories = state.categories.filter(c=>c.id!==id);
    delete state.budgetDefault[id];
    delete state.monthData.budgetOverride[id];
    await saveJSON('categories', state.categories);
    await saveJSON('budgetDefault', state.budgetDefault);
    await persistMonth();
  }else if(type==='sub'){
    const [majorId, subId] = id.split(':');
    const major = state.categories.find(c=>c.id===majorId);
    if(major) major.subs = major.subs.filter(s=>s.id!==subId);
    await saveJSON('categories', state.categories);
  }else if(type==='pay'){
    if(state.paymentMethods.length<=1) return;
    state.paymentMethods = state.paymentMethods.filter(p=>p.id!==id);
    await saveJSON('paymentMethods', state.paymentMethods);
  }else if(type==='inc'){
    if(state.incomeCategories.length<=1) return;
    state.incomeCategories = state.incomeCategories.filter(p=>p.id!==id);
    await saveJSON('incomeCategories', state.incomeCategories);
  }
}

/* major -> sub cascade (targeted DOM update, no full re-render) */
document.addEventListener('change', async (e)=>{
  if(e.target.id==='majorId'){
    const major = state.categories.find(c=>c.id===e.target.value);
    const subSelect = document.getElementById('subId');
    subSelect.innerHTML = (major?major.subs:[]).map(s=>`<option value="${s.id}">${escapeHtml(s.name)}</option>`).join('');
    return;
  }
  if(e.target.hasAttribute('data-major-ov-check')){
    const majorId = e.target.getAttribute('data-major-ov-check');
    const valInput = document.querySelector('[data-major-ov-value="'+majorId+'"]');
    valInput.disabled = !e.target.checked;
    if(!e.target.checked) valInput.value='';
    return;
  }
});

/* rename fields commit on blur (focusout bubbles) */
document.addEventListener('focusout', async (e)=>{
  const type = e.target.getAttribute && e.target.getAttribute('data-rename');
  if(!type) return;
  const val = e.target.value.trim();
  if(!val){ e.target.value = restoreOldName(type, e.target); return; }
  if(type==='major'){
    const c = state.categories.find(c=>c.id===e.target.dataset.id);
    if(c && c.name!==val){ c.name=val; await saveJSON('categories', state.categories); }
  }else if(type==='sub'){
    const c = state.categories.find(c=>c.id===e.target.dataset.major);
    const s = c && c.subs.find(s=>s.id===e.target.dataset.id);
    if(s && s.name!==val){ s.name=val; await saveJSON('categories', state.categories); }
  }else if(type==='pay'){
    const p = state.paymentMethods.find(p=>p.id===e.target.dataset.id);
    if(p && p.name!==val){ p.name=val; await saveJSON('paymentMethods', state.paymentMethods); }
  }else if(type==='inc'){
    const p = state.incomeCategories.find(p=>p.id===e.target.dataset.id);
    if(p && p.name!==val){ p.name=val; await saveJSON('incomeCategories', state.incomeCategories); }
  }
});
function restoreOldName(type, el){
  if(type==='major'){ const c=state.categories.find(c=>c.id===el.dataset.id); return c?c.name:''; }
  if(type==='sub'){ const c=state.categories.find(c=>c.id===el.dataset.major); const s=c&&c.subs.find(s=>s.id===el.dataset.id); return s?s.name:''; }
  if(type==='pay'){ const p=state.paymentMethods.find(p=>p.id===el.dataset.id); return p?p.name:''; }
  if(type==='inc'){ const p=state.incomeCategories.find(p=>p.id===el.dataset.id); return p?p.name:''; }
  return '';
}

/* keyboard: Enter commits rename fields */
document.addEventListener('keydown', (e)=>{
  if(e.key==='Enter' && e.target.matches('[data-rename]')){ e.preventDefault(); e.target.blur(); }
});

/* form submits */
document.addEventListener('submit', async (e)=>{
  if(e.target.id==='tx-form'){
    e.preventDefault();
    const tx = buildTxFromForm(e.target);
    if(!tx.amount || tx.amount<=0) return;
    if(state.editingTxId){
      const idx = state.monthData.transactions.findIndex(t=>t.id===state.editingTxId);
      if(idx>-1) state.monthData.transactions[idx] = {...tx, id:state.editingTxId};
      state.editingTxId=null;
    }else{
      state.monthData.transactions.push({...tx, id:uid('t')});
    }
    await persistMonth();
    renderTab();
    return;
  }
  if(e.target.id==='budget-form'){
    e.preventDefault();
    document.querySelectorAll('.default-budget-input').forEach(inp=>{
      const majorId = inp.dataset.major;
      const v = Math.max(0, Math.round(Number(inp.value)||0));
      if(v>0) state.budgetDefault[majorId]=v; else delete state.budgetDefault[majorId];
    });
    document.querySelectorAll('[data-major-ov-check]').forEach(chk=>{
      const majorId = chk.getAttribute('data-major-ov-check');
      const valInput = document.querySelector('[data-major-ov-value="'+majorId+'"]');
      if(chk.checked){
        const v = Math.max(0, Math.round(Number(valInput.value)||0));
        state.monthData.budgetOverride[majorId]=v;
      }else{
        delete state.monthData.budgetOverride[majorId];
      }
    });
    await saveJSON('budgetDefault', state.budgetDefault);
    await persistMonth();
    renderTab();
    const msg = document.getElementById('savedMsg');
    if(msg){ msg.textContent='保存しました'; setTimeout(()=>{ if(msg) msg.textContent=''; }, 2200); }
    return;
  }
});

init();
</script>
</body>
</html>
